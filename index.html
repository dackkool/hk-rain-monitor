<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程地址即時降雨監控</title>
    <!-- 引入 Tailwind CSS 方便手機版排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen pb-10">

    <!-- 頂部導航欄 -->
    <header class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold"><i class="fa-solid font-bold fa-cloud-showers-heavy mr-2"></i>工地降雨監控儀表板</h1>
            <p class="text-xs text-blue-200" id="last-update">資料更新中...</p>
        </div>
        <button onclick="fetchWeatherData()" class="bg-blue-600 hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-sm transition font-medium flex items-center">
            <i class="fa-solid fa-rotate mr-1"></i> 重新整理
        </button>
    </header>

    <main class="max-w-md md:max-w-2xl mx-auto px-4 mt-4">

        <!-- 天文台現行警告提示區 -->
        <div id="warning-box" class="hidden mb-4 p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-800 rounded shadow-sm text-sm">
            <div class="font-bold flex items-center"><i class="fa-solid fa-triangle-exclamation mr-2"></i> 天文台現正生效警告：</div>
            <div id="warning-list" class="mt-1 font-semibold"></div>
        </div>

        <!-- 狀態統計簡報 -->
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-white p-3 rounded-lg shadow border-t-4 border-emerald-500 text-center">
                <div class="text-xs text-gray-500">正常/無雨</div>
                <div class="text-xl font-bold text-emerald-600" id="cnt-safe">0</div>
            </div>
            <div class="bg-white p-3 rounded-lg shadow border-t-4 border-amber-500 text-center">
                <div class="text-xs text-gray-500">微雨/戒備</div>
                <div class="text-xl font-bold text-amber-600" id="cnt-alert">0</div>
            </div>
            <div class="bg-white p-3 rounded-lg shadow border-t-4 border-rose-500 text-center">
                <div class="text-xs text-gray-500">大雨/警報</div>
                <div class="text-xl font-bold text-rose-600" id="cnt-critical">0</div>
            </div>
        </div>

        <!-- 工程地點清單 -->
        <div id="site-cards" class="space-y-3">
            <div class="text-center py-10 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-2"></i>
                <p>正在連線香港天文台數據...</p>
            </div>
        </div>

    </main>

    <script>
        let sitesData = [];

        // 1. 初始化：載入工地清單與天文台數據
        async function init() {
            try {
                const res = await fetch('sites.json');
                sitesData = await res.json();
                await fetchWeatherData();
            } catch (err) {
                document.getElementById('site-cards').innerHTML = 
                    `<div class="bg-red-100 text-red-700 p-4 rounded text-center">無法載入 sites.json 檔案，請確認檔案路徑。</div>`;
            }
        }

        // 2. 抓取香港天文台 API 數據
        async function fetchWeatherData() {
            try {
                // 抓取即時分區雨量數據 (rhrread)
                const rainRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const rainData = await rainRes.json();

                // 抓取現行警告摘要 (warnsum)
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();

                // 處理警告訊息
                processWarnings(warnData);

                // 處理分區雨量對比
                renderSites(rainData, warnData);

                // 更新最後更新時間
                const now = new Date();
                document.getElementById('last-update').innerText = `最後更新: ${now.toLocaleTimeString('zh-HK')}`;

            } catch (error) {
                console.error("API Fetch Error:", error);
                alert("無法取得天文台最新數據，請稍後再試。");
            }
        }

        // 3. 渲染天氣警告標籤
        function processWarnings(warnData) {
            const warnBox = document.getElementById('warning-box');
            const warnList = document.getElementById('warning-list');
            let activeWarns = [];

            if (warnData) {
                if (warnData.WRAIN) activeWarns.push(warnData.WRAIN.name);
                if (warnData.WTS) activeWarns.push(warnData.WTS.name);
                if (warnData.WMSGNL) activeWarns.push(warnData.WMSGNL.name);
            }

            if (activeWarns.length > 0) {
                warnList.innerText = activeWarns.join(" | ");
                warnBox.classList.remove('hidden');
            } else {
                warnBox.classList.add('hidden');
            }
        }

        // 4. 計算並渲染每個工程地址的雨量及訊號
        function renderSites(rainData, warnData) {
            const container = document.getElementById('site-cards');
            container.innerHTML = '';

            let cntSafe = 0, cntAlert = 0, cntCritical = 0;

            // 建立分區雨量 Mapping
            const districtRainMap = {};
            if (rainData.rainfall && rainData.rainfall.data) {
                rainData.rainfall.data.forEach(item => {
                    districtRainMap[item.place] = item.max;
                });
            }

            // 天氣警告狀態
            const hasYellowRain = warnData?.WRAIN?.code === 'WRAINY';
            const hasRedRain = warnData?.WRAIN?.code === 'WRAINR';
            const hasBlackRain = warnData?.WRAIN?.code === 'WRAINB';
            const hasThunder = !!warnData?.WTS;

            sitesData.forEach(site => {
                // 取得該區過去1小時最高雨量 (毫米)
                const rainValue = districtRainMap[site.district] ?? 0;

                // 判定訊號強度 (Signal Logic)
                let statusClass = "bg-emerald-50 border-emerald-500 text-emerald-900";
                let badgeClass = "bg-emerald-500 text-white";
                let icon = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
                let signalText = "🟢 正常施工";
                let advice = "無降雨影響，可正常進行戶外工程。";
                let level = "safe";

                if (rainValue >= 10 || hasRedRain || hasBlackRain) {
                    // 紅燈：大雨/暴雨警告/停止戶外高空工程
                    statusClass = "bg-rose-50 border-rose-500 text-rose-900";
                    badgeClass = "bg-rose-600 text-white";
                    icon = '<i class="fa-solid fa-triangle-exclamation text-rose-600"></i>';
                    signalText = "🔴 停工/大雨警報";
                    advice = "該區雨量較大或暴雨生效中！建議暫停戶外/高空工程及進行防雨防汛措施。";
                    level = "critical";
                    cntCritical++;
                } else if (rainValue > 0 || hasYellowRain || hasThunder) {
                    // 黃燈：有微雨/雷暴警戒
                    statusClass = "bg-amber-50 border-amber-500 text-amber-900";
                    badgeClass = "bg-amber-500 text-white";
                    icon = '<i class="fa-solid fa-cloud-rain text-amber-500"></i>';
                    signalText = "🟡 雨勢/雷暴預警";
                    advice = "該區正在下雨或有雷暴警告，請注意物件覆蓋及戶外用電安全。";
                    level = "alert";
                    cntAlert++;
                } else {
                    cntSafe++;
                }

                // 生成工地 Card HTML
                const cardHTML = `
                    <div class="bg-white rounded-lg shadow-md border-l-4 p-4 transition ${statusClass.split(' ')[1]}">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded mr-1">${site.district}</span>
                                <span class="text-xs font-semibold text-slate-400">ID: ${site.id}</span>
                                <h2 class="text-lg font-bold text-gray-800 mt-1">${site.name}</h2>
                                <p class="text-xs text-gray-500">${site.address || ''}</p>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${badgeClass}">${signalText}</span>
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-100 flex justify-between items-center text-sm">
                            <span class="text-gray-600"><i class="fa-solid fa-droplet text-blue-500 mr-1"></i>過去1小時雨量:</span>
                            <span class="font-bold text-base ${rainValue > 0 ? 'text-blue-600' : 'text-gray-400'}">${rainValue} mm</span>
                        </div>
                        <div class="mt-2 text-xs text-gray-600 bg-white/60 p-2 rounded border border-gray-200/50">
                            💡 ${advice}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });

            // 更新統計數字
            document.getElementById('cnt-safe').innerText = cntSafe;
            document.getElementById('cnt-alert').innerText = cntAlert;
            document.getElementById('cnt-critical').innerText = cntCritical;
        }

        // 自動每 3 分鐘重新整理一次
        setInterval(fetchWeatherData, 180000);

        // 頁面載入完成後啟動
        window.onload = init;
    </script>
</body>
</html>
